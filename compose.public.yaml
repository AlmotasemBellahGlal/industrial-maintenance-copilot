# UNTESTED overlay for a single-host public demo. Not part of CI yet.
# Use:  docker compose -f compose.yaml -f compose.public.yaml up -d --wait
# Requires DEMO_DOMAIN in .env pointing at this host (A record), ports 80/443 open.
# Does NOT solve per-visitor isolation. See deploy/public/README.md.
services:
  web:
    # Remove the loopback publish: only Caddy is reachable from outside.
    ports: !reset []
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?set DEMO_DOMAIN in .env}
    volumes:
      - ./deploy/public/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
volumes:
  caddy-data:
  caddy-config:
