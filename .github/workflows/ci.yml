name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Angular build, contracts and accessible browser workflows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IndustrialCopilot.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/IndustrialCopilot.Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  validate:
    name: Build and test with PostgreSQL knowledge store
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      RAG_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=isolated_ci_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build
      - name: Test including isolated pgvector integration tests
        run: dotnet test --no-build --logger "trx;LogFilePrefix=tests"
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/IndustrialCopilot.Web/package-lock.json
      - name: Start isolated deterministic demo API and Worker
        env:
          PGPASSWORD: isolated_ci_only
          ASPNETCORE_ENVIRONMENT: Development
          DEMO_POSTGRES: Host=localhost;Port=5432;Database=maintenance_demo;Username=postgres;Password=isolated_ci_only
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE maintenance_demo'
          mkdir -p artifacts/issue25
          dotnet run --no-build --project tools/IndustrialCopilot.Demo -- --demo > artifacts/issue25/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5000/health/ready
          MAINTENANCE_CONFIG="$PWD/artifacts/issue25/host.json" dotnet run --no-build --project src/IndustrialCopilot.Worker > artifacts/issue25/worker.log 2>&1 &
      - name: Real HTTP/PostgreSQL bilingual smoke
        run: node tools/demo-smoke.mjs
      - name: Browser integration against the real demo host
        working-directory: src/IndustrialCopilot.Web
        env:
          DEMO_E2E: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- integration.spec.ts
