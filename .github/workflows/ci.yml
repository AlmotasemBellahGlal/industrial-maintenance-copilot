name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  packaging:
    name: Fresh Docker-only product and persistence proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: packaging-ci
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile tools build --builder default api web smoke
          docker compose up -d --wait
          docker compose run --rm --no-deps corpus
          docker compose run --rm --no-deps corpus corpus-status
          docker compose run --rm --no-deps corpus
          docker compose run --rm --no-deps smoke
          docker compose down
          docker compose up -d --wait
          docker compose run --rm --no-deps smoke --verify-restart
      - name: Worker process crash and safe replay
        run: |
          docker compose stop worker
          docker compose run -d --no-deps --name packaging-recovery-worker -e DEMO_MODEL_DELAY_MS=30000 worker
          docker compose run --rm --no-deps smoke --submit-recovery
          docker rm -f packaging-recovery-worker
          docker compose start worker
          docker compose run --rm --no-deps smoke --verify-recovery
      - name: Isolated Docker-only evaluation and production runtime targets
        run: |
          docker compose --profile evaluation build --builder default evaluation
          docker compose --profile evaluation up -d --wait evaluation-db
          docker compose run --rm --no-deps evaluation --repeat
          docker build --builder default --target api -t production-api-check .
          docker build --builder default --target worker -t production-worker-check .
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Browser through production Nginx
        env:
          DEMO_E2E: '1'
          DEMO_WEB_URL: http://127.0.0.1:8080
          DEMO_API_BASE: http://127.0.0.1:8080/api
        run: |
          mkdir -p artifacts/issue25
          docker compose run --rm --no-deps --entrypoint cat credentials /app-secrets/supervisor > artifacts/issue25/credential.txt
          docker compose run --rm --no-deps --entrypoint cat credentials /app-secrets/technician > artifacts/issue25/technician-credential.txt
          cd src/IndustrialCopilot.Web
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- integration.spec.ts product-integration.spec.ts
      - name: Safe operational logs
        if: failure()
        run: docker compose logs migrate seed api worker web
      - name: Stop isolated stack
        if: always()
        run: docker compose --profile tools --profile evaluation down

  security:
    name: Full-history secrets and dependency security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test tools/smoke-http.test.mjs
      - run: python3 scripts/security/scan.py secrets
      - run: dotnet restore
      - run: python3 scripts/security/scan.py dependencies

  frontend:
    name: Angular build, contracts and accessible browser workflows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IndustrialCopilot.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/IndustrialCopilot.Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  validate:
    name: Build and test with PostgreSQL knowledge store
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      RAG_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=isolated_ci_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build
      - name: Test including isolated pgvector integration tests
        run: dotnet test --no-build --logger "trx;LogFilePrefix=tests"
      - name: FR-3 golden validation and real reproducible baseline
        env:
          PGPASSWORD: isolated_ci_only
          EVALUATION_POSTGRES: Host=localhost;Port=5432;Database=maintenance_evaluation;Username=postgres;Password=isolated_ci_only
        run: |
          dotnet run --no-build --project tools/IndustrialCopilot.Evaluation -- --validate
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE maintenance_evaluation'
          dotnet run --no-build --project tools/IndustrialCopilot.Evaluation -- --repeat
      - name: Retain measured evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr3-evaluation
          path: artifacts/evaluation/
          if-no-files-found: warn
      - name: Validate and ingest synthetic assessment corpus with exact retrieval citations
        env:
          PGPASSWORD: isolated_ci_only
          CORPUS_POSTGRES: Host=localhost;Port=5432;Database=maintenance_corpus;Username=postgres;Password=isolated_ci_only
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE maintenance_corpus'
          dotnet run --no-build --project tools/IndustrialCopilot.Corpus -- --ingest
          dotnet run --no-build --project tools/IndustrialCopilot.Corpus -- --ingest
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/IndustrialCopilot.Web/package-lock.json
      - name: Start isolated deterministic demo API
        env:
          PGPASSWORD: isolated_ci_only
          ASPNETCORE_ENVIRONMENT: Development
          DEMO_POSTGRES: Host=localhost;Port=5432;Database=maintenance_demo;Username=postgres;Password=isolated_ci_only
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE maintenance_demo'
          mkdir -p artifacts/issue25
          dotnet run --no-build --project tools/IndustrialCopilot.Demo -- --demo > artifacts/issue25/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5000/health/ready

      - name: Real technician versus supervisor authorization proof
        run: python3 scripts/security/demo_roles.py

      - name: Durable reasoning process crash, recovery, cancellation and bilingual safety proof
        timeout-minutes: 5
        env:
          DEMO_POSTGRES: Host=localhost;Port=5432;Database=maintenance_demo;Username=postgres;Password=isolated_ci_only
        run: node tools/t7-smoke.mjs
      - name: Retain durable reasoning proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t7-live-proof
          path: artifacts/t7-proof.json
          if-no-files-found: warn
      - name: Real HTTP/PostgreSQL bilingual smoke
        run: node tools/demo-smoke.mjs
      - name: Request-owned bilingual Ask and ingestion proof
        run: node tools/product-smoke.mjs
      - name: Retain product proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-streaming-proof
          path: artifacts/product-proof.json
          if-no-files-found: warn
      - name: Browser integration against the real demo host
        working-directory: src/IndustrialCopilot.Web
        env:
          DEMO_E2E: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- integration.spec.ts product-integration.spec.ts
