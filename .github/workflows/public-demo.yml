name: Public demo overlay

# Exercises the public overlay (Production API, Caddy TLS, anonymous sessions, cleanup) on a real Docker host.
# Separate from ci.yml so the legacy Development stack proof is untouched.
on:
  pull_request:
    branches:
      - main

jobs:
  public-overlay:
    name: "Public overlay - Production container, TLS proxy, sessions, cleanup"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: public-ci
      COMPOSE_FILE: compose.yaml:compose.public.yaml
      DEMO_MAX_SESSIONS_PER_CLIENT_HOUR: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Start the public overlay
        run: |
          cp .env.example .env
          echo 'DEMO_DOMAIN=localhost' >> .env
          docker compose config --quiet
          docker compose build --builder default api web
          docker compose up -d --wait
      - name: API runs as Production
        run: |
          docker inspect "$(docker compose ps -q api)" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -x 'ASPNETCORE_ENVIRONMENT=Production'
          docker inspect "$(docker compose ps -q worker)" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -x 'ASPNETCORE_ENVIRONMENT=Production'
      - name: Trust the Caddy local CA
        run: |
          for i in $(seq 1 30); do docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt" 2>/dev/null && break; sleep 2; done
          test -s "$RUNNER_TEMP/caddy-root.crt"
      - name: Sessions, isolation, limits through the proxy
        id: flow
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/caddy-root.crt
        run: |
          node tools/public-smoke.mjs flow | tee "$RUNNER_TEMP/flow.txt"
          echo "state=$(tail -n 1 "$RUNNER_TEMP/flow.txt")" >> "$GITHUB_OUTPUT"
      - name: Expired sessions are cleaned up without touching seeded data
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/caddy-root.crt
          PUBLIC_SMOKE_STATE: ${{ steps.flow.outputs.state }}
        run: |
          sql() { docker compose exec -T db psql -U postgres -d maintenance_demo -At -c "$1"; }
          manuals=$(sql "SELECT count(*) FROM operations.manuals")
          test "$manuals" -ge 1
          sessions=$(sql "SELECT count(*) FROM operations.demo_sessions")
          test "$sessions" -ge 2
          sql "UPDATE operations.demo_sessions SET expires_at = clock_timestamp() - interval '1 minute'"
          for i in $(seq 1 40); do
            left=$(sql "SELECT count(*) FROM operations.demo_sessions")
            [ "$left" = "0" ] && break
            sleep 5
          done
          test "$left" = "0"
          test "$(sql "SELECT count(*) FROM operations.reasoning_jobs WHERE actor LIKE 'visitor-%'")" = "0"
          test "$(sql "SELECT count(*) FROM operations.manuals")" = "$manuals"
          node tools/public-smoke.mjs after-expiry
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color migrate seed api worker web caddy | tail -300
      - name: Stop stack
        if: always()
        run: docker compose down -v
